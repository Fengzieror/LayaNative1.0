name: Build Android (new V8, arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false          # 仓库 .gitmodules(openssl/msgpack-c) 是遗留声明，不拉子模块

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # AGP 8.1.2 需要 JDK 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK + SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-28" \
            "build-tools;28.0.0" "build-tools;30.0.3" \
            "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build native engine (arm64-v8a)
        working-directory: Conch/build
        run: |
          export PATH="$ANDROID_NDK_HOME:$PATH"
          chmod +x buildAll-android.sh
          ./buildAll-android.sh

      - name: Upload liblayaair.so (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: liblayaair-arm64
          path: Conch/build/conch/proj.android_studio/conch5/libs/arm64-v8a/liblayaair.so
          if-no-files-found: error

      - name: Package APK (best-effort; AGP/compileSdk may need adjusting)
        continue-on-error: true
        working-directory: Conch/build/conch/proj.android_studio
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layaair-android-apk
          path: Conch/build/conch/proj.android_studio/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
